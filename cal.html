<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG 맞춤형 대출 상환 계산기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f3f4f6; /* 더 부드러운 배경색 */
        }
        
        /* 스크롤바 심플화 */
        .table-container::-webkit-scrollbar { width: 6px; height: 6px; }
        .table-container::-webkit-scrollbar-track { background: transparent; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* MG 브랜드 컬러 */
        script[tailwind] {
            --tw-mg-blue: #005baa;
            --tw-mg-light: #f0f6fc;
        }
        
        /* 숫자 입력 화살표 숨김 */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mg: { blue: '#005baa', light: '#f0f6fc' }
                    }
                }
            }
        }
    </script>
</head>
<body class="text-slate-800 antialiased min-h-screen flex items-center justify-center p-4 lg:p-8">

    <!-- Main Card Container -->
    <main class="w-full max-w-5xl bg-white rounded-[2rem] shadow-xl overflow-hidden flex flex-col lg:flex-row">
        
        <!-- Left: Input Section -->
        <section class="w-full lg:w-1/2 p-8 lg:p-12 border-b lg:border-b-0 lg:border-r border-slate-100">
            <div class="flex items-center gap-2 mb-10">
                <div class="w-8 h-8 bg-mg-blue rounded-full flex items-center justify-center font-bold text-white text-sm">MG</div>
                <h1 class="text-xl font-bold">대출 상환 계산기</h1>
            </div>

            <!-- 1. 대출 금액 -->
            <div class="mb-10">
                <label class="block text-sm font-medium text-slate-500 mb-2">얼마를 빌릴까요?</label>
                <div class="relative flex items-baseline border-b-2 border-slate-200 focus-within:border-mg-blue transition-colors pb-2">
                    <input type="text" id="loanAmount" class="w-full text-4xl font-bold outline-none bg-transparent placeholder-slate-300" placeholder="0" value="10,000" oninput="formatNumberInput(this)">
                    <span class="text-xl font-semibold text-slate-600 ml-2 whitespace-nowrap">만원</span>
                </div>
                <!-- 빠른 버튼 -->
                <div class="flex flex-wrap gap-2 mt-4">
                    <button type="button" onclick="addAmount(100)" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 rounded-full hover:bg-slate-200 transition">+100만</button>
                    <button type="button" onclick="addAmount(500)" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 rounded-full hover:bg-slate-200 transition">+500만</button>
                    <button type="button" onclick="addAmount(1000)" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 rounded-full hover:bg-slate-200 transition">+1000만</button>
                    <button type="button" onclick="clearAmount()" class="px-4 py-2 text-sm font-medium text-slate-400 bg-white border border-slate-200 rounded-full hover:bg-slate-50 transition">초기화</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                <!-- 2. 대출 기간 -->
                <div>
                    <label class="block text-sm font-medium text-slate-500 mb-3">기간</label>
                    <div class="flex items-center gap-2 mb-3">
                        <input type="number" id="loanTerm" class="w-full text-2xl font-bold outline-none border-b-2 border-slate-200 focus:border-mg-blue pb-1 transition-colors" value="5">
                        <span id="termLabel" class="text-lg font-medium text-slate-600 whitespace-nowrap">년</span>
                    </div>
                    <!-- 기간 단위 토글 -->
                    <div class="flex bg-slate-100 rounded-lg p-1">
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="termType" value="years" class="peer sr-only" checked onchange="updateTermLabel()">
                            <div class="py-1.5 rounded-md text-sm font-medium text-slate-500 peer-checked:bg-white peer-checked:text-mg-blue peer-checked:shadow-sm transition-all">년 단위</div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="termType" value="months" class="peer sr-only" onchange="updateTermLabel()">
                            <div class="py-1.5 rounded-md text-sm font-medium text-slate-500 peer-checked:bg-white peer-checked:text-mg-blue peer-checked:shadow-sm transition-all">개월 단위</div>
                        </label>
                    </div>
                </div>

                <!-- 3. 연 이자율 -->
                <div>
                    <label class="block text-sm font-medium text-slate-500 mb-3">연 이자율</label>
                    <div class="flex items-center gap-2 mb-3">
                        <input type="number" id="interestRate" step="0.1" class="w-full text-2xl font-bold outline-none border-b-2 border-slate-200 focus:border-mg-blue pb-1 transition-colors" value="4.5">
                        <span class="text-lg font-medium text-slate-600">%</span>
                    </div>
                    <input type="range" id="rateSlider" min="1" max="20" step="0.1" value="4.5" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-mg-blue" oninput="document.getElementById('interestRate').value = this.value">
                </div>
            </div>

            <!-- 4. 상환 방식 -->
            <div class="mb-10">
                <label class="block text-sm font-medium text-slate-500 mb-3">상환 방식</label>
                <div class="flex bg-slate-100 rounded-xl p-1.5">
                    <label class="flex-1 text-center cursor-pointer">
                        <input type="radio" name="repaymentMethod" value="equal_pmt" class="peer sr-only" checked>
                        <div class="py-2.5 rounded-lg text-sm font-bold text-slate-500 peer-checked:bg-white peer-checked:text-mg-blue peer-checked:shadow transition-all">원리금균등</div>
                    </label>
                    <label class="flex-1 text-center cursor-pointer">
                        <input type="radio" name="repaymentMethod" value="equal_prn" class="peer sr-only">
                        <div class="py-2.5 rounded-lg text-sm font-bold text-slate-500 peer-checked:bg-white peer-checked:text-mg-blue peer-checked:shadow transition-all">원금균등</div>
                    </label>
                    <label class="flex-1 text-center cursor-pointer">
                        <input type="radio" name="repaymentMethod" value="bullet" class="peer sr-only">
                        <div class="py-2.5 rounded-lg text-sm font-bold text-slate-500 peer-checked:bg-white peer-checked:text-mg-blue peer-checked:shadow transition-all">만기일시</div>
                    </label>
                </div>
            </div>

            <button onclick="calculateLoan()" class="w-full bg-mg-blue hover:bg-[#004b8d] text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/30 transition-all text-lg active:scale-[0.98]">
                계산하기
            </button>
        </section>

        <!-- Right: Results Section -->
        <section class="w-full lg:w-1/2 bg-slate-50 p-8 lg:p-12 flex flex-col relative h-[500px] lg:h-auto">
            
            <!-- Default Empty State -->
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                </div>
                <p class="font-medium text-lg text-slate-500">결과가 이곳에 표시됩니다</p>
                <p class="text-sm mt-1">조건을 입력하고 계산하기를 눌러주세요.</p>
            </div>

            <!-- Result Content (Hidden by default) -->
            <div id="resultContent" class="hidden flex-col h-full opacity-0 transition-opacity duration-500">
                
                <!-- Highlight Summary -->
                <div class="text-center mb-8">
                    <p class="text-sm font-medium text-mg-blue mb-2 rounded-full bg-mg-light inline-block px-3 py-1" id="summaryBadge">원리금균등분할상환</p>
                    <p class="text-slate-500 font-medium mb-1">매월 상환할 금액(1회차)</p>
                    <div class="text-4xl font-bold text-slate-800 flex justify-center items-end gap-1">
                        <span id="summaryFirstPayment">0</span><span class="text-xl font-medium text-slate-600 mb-1">원</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-8 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 mb-1">총 대출 이자</p>
                        <p class="text-lg font-bold text-slate-700"><span id="summaryTotalInterest">0</span><span class="text-sm font-normal ml-0.5">원</span></p>
                    </div>
                    <div>
                        <p class="text-xs font-semibold text-slate-400 mb-1">총 상환 금액</p>
                        <p class="text-lg font-bold text-slate-700"><span id="summaryTotalRepayment">0</span><span class="text-sm font-normal ml-0.5">원</span></p>
                    </div>
                </div>

                <!-- Schedule Table -->
                <div class="flex-grow flex flex-col min-h-0 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="bg-slate-100/50 px-4 py-3 border-b border-slate-100 flex justify-between items-center">
                        <h3 class="font-bold text-sm text-slate-700">회차별 상환 스케줄</h3>
                        <span class="text-xs text-slate-500" id="scheduleMonthCount">총 0회차</span>
                    </div>
                    <div class="flex-grow overflow-auto table-container">
                        <table class="w-full text-sm text-right">
                            <thead class="bg-white sticky top-0 shadow-[0_1px_2px_rgba(0,0,0,0.05)] text-slate-500 text-xs font-medium">
                                <tr>
                                    <th class="px-3 py-3 text-center w-12">회차</th>
                                    <th class="px-3 py-3">납입 원금</th>
                                    <th class="px-3 py-3">대출 이자</th>
                                    <th class="px-3 py-3 text-mg-blue font-bold">월 상환금</th>
                                </tr>
                            </thead>
                            <tbody id="scheduleBody" class="divide-y divide-slate-50 text-slate-600 text-xs sm:text-sm">
                                <!-- Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </section>
    </main>

    <script>
        // 이자율 슬라이더 연동
        document.getElementById('interestRate').addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            if(!isNaN(val)) document.getElementById('rateSlider').value = Math.min(Math.max(val, 0), 20);
        });

        // 숫자 콤마 포맷팅
        function formatNumber(num) {
            return Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // 입력창 실시간 포맷팅
        function formatNumberInput(input) {
            let val = input.value.replace(/,/g, '');
            if(!isNaN(val) && val !== '') {
                input.value = formatNumber(parseInt(val));
            } else {
                input.value = val.replace(/[^0-9]/g, '');
            }
        }

        // 빠른 금액 추가
        function addAmount(amount) {
            const input = document.getElementById('loanAmount');
            let currentVal = parseInt(input.value.replace(/,/g, '')) || 0;
            input.value = formatNumber(currentVal + amount);
        }

        // 금액 초기화
        function clearAmount() {
            document.getElementById('loanAmount').value = '';
        }

        // 기간 라벨 변경 (년/개월)
        function updateTermLabel() {
            const isYears = document.querySelector('input[name="termType"]:checked').value === 'years';
            document.getElementById('termLabel').textContent = isYears ? '년' : '개월';
        }

        // 대출 계산 로직
        function calculateLoan() {
            const amountInput = document.getElementById('loanAmount').value.replace(/,/g, '');
            const termInput = document.getElementById('loanTerm').value;
            const rateInput = document.getElementById('interestRate').value;
            const method = document.querySelector('input[name="repaymentMethod"]:checked').value;
            const termType = document.querySelector('input[name="termType"]:checked').value;

            if(!amountInput || parseInt(amountInput) <= 0) return alert('대출 금액을 입력해주세요.');
            if(!termInput || parseInt(termInput) <= 0) return alert('대출 기간을 입력해주세요.');
            if(!rateInput || parseFloat(rateInput) < 0) return alert('연 이자율을 입력해주세요.');

            const principal = parseInt(amountInput) * 10000;
            const annualRate = parseFloat(rateInput) / 100;
            const monthlyRate = annualRate / 12;
            let totalMonths = parseInt(termInput);
            if(termType === 'years') totalMonths *= 12;

            let schedule = [];
            let balance = principal;
            let totalInterest = 0;
            let firstMonthPayment = 0;

            if (method === 'equal_pmt') {
                let payment = monthlyRate > 0 ? principal * (monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1) : principal / totalMonths;
                for (let i = 1; i <= totalMonths; i++) {
                    let interest = balance * monthlyRate;
                    let prn = payment - interest;
                    if(i === totalMonths) { prn = balance; payment = prn + interest; balance = 0; } 
                    else { balance -= prn; }
                    totalInterest += interest;
                    if(i === 1) firstMonthPayment = payment;
                    schedule.push({ month: i, prn, interest, payment });
                }
            } 
            else if (method === 'equal_prn') {
                const fixedPrn = principal / totalMonths;
                for (let i = 1; i <= totalMonths; i++) {
                    let interest = balance * monthlyRate;
                    let prn = i === totalMonths ? balance : fixedPrn;
                    let payment = prn + interest;
                    balance -= prn;
                    totalInterest += interest;
                    if(i === 1) firstMonthPayment = payment;
                    schedule.push({ month: i, prn, interest, payment });
                }
            } 
            else if (method === 'bullet') {
                const interest = principal * monthlyRate;
                for (let i = 1; i <= totalMonths; i++) {
                    let prn = i === totalMonths ? principal : 0;
                    let payment = prn + interest;
                    totalInterest += interest;
                    if(i === 1) firstMonthPayment = payment;
                    schedule.push({ month: i, prn, interest, payment });
                }
            }

            renderResults(schedule, totalInterest, principal, firstMonthPayment, method, totalMonths);
        }

        // 결과 화면 렌더링
        function renderResults(schedule, totalInterest, principal, firstPayment, method, totalMonths) {
            document.getElementById('emptyState').classList.add('hidden');
            const resultDiv = document.getElementById('resultContent');
            resultDiv.classList.remove('hidden');
            // setTimeout for fade-in effect
            setTimeout(() => resultDiv.classList.remove('opacity-0'), 50);

            // 뱃지 이름
            const methodNames = { 'equal_pmt': '원리금균등상환', 'equal_prn': '원금균등상환', 'bullet': '만기일시상환' };
            document.getElementById('summaryBadge').textContent = methodNames[method];

            // 요약 수치
            document.getElementById('summaryFirstPayment').textContent = formatNumber(firstPayment);
            document.getElementById('summaryTotalInterest').textContent = formatNumber(totalInterest);
            document.getElementById('summaryTotalRepayment').textContent = formatNumber(principal + totalInterest);
            document.getElementById('scheduleMonthCount').textContent = `총 ${totalMonths}회차`;

            // 테이블 렌더링
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';
            const fragment = document.createDocumentFragment();

            schedule.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="px-3 py-3 text-center text-slate-400 font-medium">${row.month}</td>
                    <td class="px-3 py-3">${formatNumber(row.prn)}</td>
                    <td class="px-3 py-3 text-slate-400">${formatNumber(row.interest)}</td>
                    <td class="px-3 py-3 font-semibold text-mg-blue">${formatNumber(row.payment)}</td>
                `;
                fragment.appendChild(tr);
            });
            tbody.appendChild(fragment);

            // 모바일 뷰일 경우 스크롤 내리기
            if (window.innerWidth < 1024) {
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
    </script>
</body>
</html>
